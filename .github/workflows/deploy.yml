name: Deploy

# Every commit to main deploys to Azure once CI is green on it (docs/adr/0004-azure-hosting.md).
# The Angular build is published into the API's wwwroot and the whole goes to one App Service.
# Azure is reached through OpenID Connect: no secret or publish profile is kept in the repository.
#
# The database is migrated before anything is published (docs/adr/0017-azure-postgresql.md): a
# migration that fails stops the deployment and leaves the version that was running in place. The
# deployment ends by requiring the new version to be live and to reach its database.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The database, its two roles and the API version its firewall is managed through. None is a
      # secret: every connection signs in with a Microsoft Entra token and no password.
      DATABASE_HOST: ${{ vars.AZURE_POSTGRES_SERVER }}.postgres.database.azure.com
      DATABASE_NAME: mondino
      DATABASE_MIGRATOR_ROLE: mondino_migrator
      DATABASE_APP_ROLE: mondino_app
      POSTGRES_API_VERSION: '2025-08-01'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - name: Publish the backend with the frontend in wwwroot, and the CLI that migrates
        working-directory: backend
        run: |
          dotnet restore --locked-mode
          dotnet publish src/Mondino.Api/Mondino.Api.csproj -c Release --no-restore -o ../publish
          mkdir -p ../publish/wwwroot
          cp -r ../frontend/dist/mondino/browser/. ../publish/wwwroot/
          dotnet publish src/Mondino.Cli/Mondino.Cli.csproj -c Release --no-restore -o ../publish-cli

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Take the database token while the sign-in is fresh
        # The sign-in's OpenID Connect assertion lasts a few minutes. The Azure CLI keeps the token
        # it is given now, and the migration reads it from there. Nothing is printed.
        run: az account get-access-token --resource https://ossrdbms-aad.database.windows.net --output none

      - id: azure
        name: Find the app's resource group, which is the database's too
        run: |
          group=$(az webapp list --query "[?name=='${{ vars.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
          [ -n "$group" ] || { echo "::error::The App Service ${{ vars.AZURE_WEBAPP_NAME }} was not found"; exit 1; }
          [ -n "${{ vars.AZURE_POSTGRES_SERVER }}" ] || { echo "::error::The variable AZURE_POSTGRES_SERVER is not set (docs/deployment/README.md)"; exit 1; }
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "server=/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$group/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ vars.AZURE_POSTGRES_SERVER }}" >> "$GITHUB_OUTPUT"

      - name: Check the required app settings are set
        # By name only: no value is read or printed (docs/deployment/README.md).
        run: |
          names=$(az webapp config appsettings list -g "${{ steps.azure.outputs.group }}" \
            -n "${{ vars.AZURE_WEBAPP_NAME }}" --query "[].name" -o tsv)
          missing=0
          for setting in EmailProtection__Key PostalCodeSource__Username; do
            grep -qx "$setting" <<< "$names" || { echo "::error::App setting $setting is not set (docs/deployment/README.md)"; missing=1; }
          done
          exit $missing

      - id: firewall
        name: Let this runner through the database's firewall
        # One rule for this runner's own address, for the length of the migration. The rule is
        # written and read as a resource, so the deployment needs no right beyond this server.
        run: |
          address=$(curl -fsS --max-time 10 https://api.ipify.org)
          [[ "$address" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::Could not learn this runner's address"; exit 1; }
          rule="deploy-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
          url="${{ steps.azure.outputs.server }}/firewallRules/$rule?api-version=$POSTGRES_API_VERSION"
          az rest --method put --url "$url" --output none \
            --body "{\"properties\":{\"startIpAddress\":\"$address\",\"endIpAddress\":\"$address\"}}"
          for attempt in $(seq 1 36); do
            if [ "$(az rest --method get --url "$url" --query name -o tsv 2>/dev/null)" = "$rule" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The firewall rule was not in place within 3 minutes"
          exit 1

      - name: Apply the database's migrations
        # Before anything is published. Each migration runs in its own transaction, so a failure
        # leaves the schema at the last one that succeeded, and stops the deployment here.
        env:
          Database__Provider: PostgreSQL
          Database__Authentication: AzureCli
          ConnectionStrings__Mondino: Host=${{ env.DATABASE_HOST }};Database=${{ env.DATABASE_NAME }};Username=${{ env.DATABASE_MIGRATOR_ROLE }}
        run: dotnet publish-cli/Mondino.Cli.dll migrate

      - name: Close the database's firewall to this runner
        # Whether or not the migration passed.
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          url="${{ steps.azure.outputs.server }}/firewallRules/${{ steps.firewall.outputs.rule }}?api-version=$POSTGRES_API_VERSION"
          for attempt in $(seq 1 36); do
            az rest --method delete --url "$url" --output none 2>/dev/null || true
            if ! az rest --method get --url "$url" --output none 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The firewall rule ${{ steps.firewall.outputs.rule }} could not be removed; remove it by hand (docs/deployment/README.md)"
          exit 1

      - name: Point the app at the database it migrated
        # Only where a setting differs, so a later deployment restarts nothing here. None of the
        # three is a secret, and no other setting is read or printed.
        run: |
          wanted=$(printf '%s\t%s\n' \
            ConnectionStrings__Mondino "Host=$DATABASE_HOST;Database=$DATABASE_NAME;Username=$DATABASE_APP_ROLE" \
            Database__Authentication ManagedIdentity \
            Database__Provider PostgreSQL)
          current=$(az webapp config appsettings list -g "${{ steps.azure.outputs.group }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --query "sort_by([?name=='ConnectionStrings__Mondino' || name=='Database__Authentication' || name=='Database__Provider'], &name)[].[name, value]" -o tsv)
          if [ "$current" != "$wanted" ]; then
            az webapp config appsettings set -g "${{ steps.azure.outputs.group }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --output none --settings \
              "ConnectionStrings__Mondino=Host=$DATABASE_HOST;Database=$DATABASE_NAME;Username=$DATABASE_APP_ROLE" \
              "Database__Authentication=ManagedIdentity" \
              "Database__Provider=PostgreSQL"
          fi

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Check the new version is live and reaches its database
        # Each endpoint answers the one word. The version before this one has no /health/ready
        # and answers it with the app's page, so "Healthy" there is the new version's own.
        run: |
          for attempt in $(seq 1 30); do
            live=$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.webapp-url }}/health/live" || true)
            ready=$(curl -fsS --max-time 10 "${{ steps.deploy.outputs.webapp-url }}/health/ready" || true)
            if [ "$live" = "Healthy" ] && [ "$ready" = "Healthy" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The deployed app did not answer Healthy at /health/live and /health/ready within 5 minutes"
          exit 1
