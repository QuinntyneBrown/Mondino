name: Deploy

# Every commit to main deploys to Azure once CI is green on it (docs/adr/0004-azure-hosting.md).
# The Angular build is published into the API's wwwroot and the whole goes to one App Service.
# Azure is reached through OpenID Connect: no secret or publish profile is kept in the repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - name: Publish the backend with the frontend in wwwroot
        working-directory: backend
        run: |
          dotnet restore --locked-mode
          dotnet publish src/Mondino.Api/Mondino.Api.csproj -c Release --no-restore -o ../publish
          mkdir -p ../publish/wwwroot
          cp -r ../frontend/dist/mondino/browser/. ../publish/wwwroot/

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Check liveness
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ steps.deploy.outputs.webapp-url }}/health/live" && exit 0
            sleep 10
          done
          echo "The deployed app did not answer /health/live within 5 minutes" && exit 1
