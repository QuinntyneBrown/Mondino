name: CI

# Lint, build and the critical acceptance paths. Unit tests and the visual, responsive and
# accessibility sweeps run locally (node tools/verify/verify.mjs), never here.
# The whole pipeline finishes in under 5 minutes; a slow or flaky check is fixed, never retried.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Chromium and its system libraries download while format, lint and build run; the e2e step
      # waits for them. This overlaps the install's half minute with work that needs no browser.
      - name: Install Chromium in the background
        run: |
          (npx playwright install --with-deps chromium > "$RUNNER_TEMP/playwright-install.log" 2>&1
           echo $? > "$RUNNER_TEMP/playwright-install.exit") &
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run e2e:typecheck
      - name: Wait for Chromium
        run: |
          timeout 180 bash -c 'until [ -f "$RUNNER_TEMP/playwright-install.exit" ]; do sleep 1; done'
          cat "$RUNNER_TEMP/playwright-install.log"
          exit "$(cat "$RUNNER_TEMP/playwright-install.exit")"
      - run: npm run e2e:only

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
