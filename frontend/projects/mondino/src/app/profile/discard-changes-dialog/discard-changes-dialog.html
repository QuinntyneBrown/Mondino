<div class="backdrop" aria-hidden="true"></div>
<div class="dialog">
  <div class="dialog__panel">
    <div class="dialog__header">
      <h2 class="dialog__title" [id]="titleId">Leave without saving?</h2>
    </div>
    <div class="dialog__body">
      <p [id]="descriptionId">
        You changed your settings but haven’t saved them. If you leave now, those changes are lost
        and your pin stays as it was.
      </p>
    </div>
    <div class="dialog__footer">
      <button mo-button type="button" (click)="dialog.close(true)">Discard and leave</button>
      <button mo-button variant="primary" type="button" (click)="dialog.close()">
        Keep editing
      </button>
    </div>
  </div>
</div>
