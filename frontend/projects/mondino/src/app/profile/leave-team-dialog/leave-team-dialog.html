<div class="backdrop" aria-hidden="true"></div>
<div class="dialog">
  <div class="dialog__panel">
    <div class="dialog__header">
      <h2 class="dialog__title" [id]="titleId">{{ title() }}</h2>
    </div>
    <div class="dialog__body">
      @if (store.leaveFailed()) {
        <mo-alert [text]="failure()" />
      }
      <p [id]="descriptionId">{{ text() }}</p>
    </div>
    <div class="dialog__footer">
      <button mo-button type="button" [disabled]="store.leaving()" (click)="dialog.close()">
        Stay
      </button>
      @if (store.leaving()) {
        <button mo-button variant="danger" type="button" aria-busy="true" disabled>
          <svg
            class="icon icon--sm icon--spin"
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
          >Leaving…
        </button>
      } @else if (store.leaveFailed()) {
        <button #retry mo-button variant="danger" type="button" (click)="store.leave()">
          Try again
        </button>
      } @else {
        <button mo-button variant="danger" type="button" (click)="store.leave()">
          {{ action() }}
        </button>
      }
    </div>
  </div>
</div>
