<main id="main" class="globe-screen" tabindex="-1">
  <section class="globe-screen__stage" aria-label="The team on the globe">
    @if (globeState() === 'Fallback') {
      <div class="globe-screen__globe">
        <mo-globe-fallback
          data-measured
          [label]="globeLabel()"
          (widthChange)="stillWidth.set($event)"
        >
          @if (stillPinPlacements(); as placements) {
            <mo-pin-layer
              pins
              [placements]="placements"
              [selectedId]="store.selectedId()"
              [selectedGroupKey]="store.selectedGroupKey()"
              (selectPin)="select($event)"
              (selectGroup)="selectGroup($event)"
            />
          }
        </mo-globe-fallback>
      </div>
    } @else {
      <div class="globe-screen__globe">
        <mo-globe
          interactive
          [label]="globeLabel()"
          [facing]="facing()"
          (stateChange)="globeState.set($event)"
          (viewChange)="showView($event)"
          (blankTap)="clear()"
        >
          <mo-globe-placeholder loading variant="disc" />
          @if (placements(); as placements) {
            <mo-pin-layer
              pins
              [placements]="placements"
              [selectedId]="store.selectedId()"
              [selectedGroupKey]="store.selectedGroupKey()"
              (selectPin)="select($event)"
              (selectGroup)="selectGroup($event)"
            />
          }
        </mo-globe>
      </div>
    }
    <mo-globe-legend [still]="globeState() === 'Fallback'" />
  </section>
  @for (panel of panels(); track panel.teammateId) {
    <!-- One teammate at a time: another is drawn afresh, so it fades in. -->
    <aside class="globe-screen__panel" [attr.aria-label]="panel.name">
      <div class="panel">
        <mo-teammate-panel [content]="panel" [clockFormat]="clockFormat()" (closed)="close()" />
      </div>
    </aside>
  }
  @if (group(); as group) {
    <aside class="globe-screen__panel" [attr.aria-label]="group.title">
      <div class="panel">
        <mo-group-panel
          [content]="group"
          [address]="addressOf"
          (teammateChosen)="select($event)"
          (closed)="close()"
        />
      </div>
    </aside>
  }
  <p class="visually-hidden" role="status" aria-live="polite">{{ announcement() }}</p>
</main>
<div class="toast-region" role="status" aria-live="polite">
  @if (toast(); as toast) {
    <mo-toast [strong]="toast.strong" [text]="toast.text" (dismiss)="dismissToast()" />
  }
</div>
