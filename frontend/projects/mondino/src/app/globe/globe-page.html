<main id="main" class="globe-screen" tabindex="-1">
  <section class="globe-screen__stage" aria-label="The team on the globe">
    @if (globeState() === 'Fallback') {
      <div class="globe-screen__globe">
        <mo-globe-fallback [label]="globeLabel" [pins]="you() ? [] : null" [you]="you()" />
      </div>
    } @else {
      <div class="globe-screen__globe">
        <mo-globe
          interactive
          [label]="globeLabel"
          [pins]="newPin() ? [] : null"
          [you]="newPin()"
          (stateChange)="globeState.set($event)"
        >
          <mo-globe-placeholder loading variant="disc" />
        </mo-globe>
      </div>
    }
    <mo-globe-legend [still]="globeState() === 'Fallback'" />
  </section>
</main>
<div class="toast-region" role="status" aria-live="polite">
  @if (toast(); as toast) {
    <mo-toast [strong]="toast.strong" [text]="toast.text" (dismiss)="dismissToast()" />
  }
</div>
