<main id="main" class="auth" tabindex="-1">
  <section class="auth__form">
    <mo-wordmark />
    <div class="auth__body">
      @if (sentTo(); as email) {
        <mo-notice
          icon="mail-check"
          title="Check your inbox"
          text="We sent a sign-in link to "
          [emphasis]="email"
          rest=". It works once, for the next 15 minutes."
          titleId="sent-title"
          status
        >
          <a slot="actions" mo-button size="lg" routerLink="/sign-in" (click)="useAnotherEmail()">
            Use another email
          </a>
        </mo-notice>
      } @else {
        <h1 class="auth__title">Welcome back.</h1>
        <p class="auth__lead">No passwords. We’ll email you a link that signs you straight in.</p>
        <form class="auth__fields" novalidate (submit)="submit($event)">
          <mo-text-field
            fieldId="email"
            name="email"
            label="Work email"
            type="email"
            inputmode="email"
            autocomplete="email"
            [maxlength]="emailLimit"
            [value]="store.email()"
            [invalid]="invalid()"
            [error]="invalid() ? 'That doesn’t look like an email address.' : null"
            errorAlert
            (valueChange)="store.setEmail($event)"
          />
          @switch (store.state().kind) {
            @case ('Sending') {
              <button
                mo-button
                variant="primary"
                size="lg"
                block
                type="submit"
                aria-busy="true"
                disabled
              >
                <svg
                  class="icon icon--sm icon--spin"
                  aria-hidden="true"
                  focusable="false"
                  viewBox="0 0 24 24"
                >
                  <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
                >Sending link…
              </button>
            }
            @case ('Failed') {
              <mo-alert
                tone="danger"
                strong="We couldn’t send the link."
                text="Mondino didn’t answer — try again in a moment."
              />
              <button mo-button variant="primary" size="lg" block type="submit">Try again</button>
            }
            @default {
              <button mo-button variant="primary" size="lg" block type="submit">
                Email me a sign-in link
              </button>
            }
          }
        </form>
      }
    </div>
    <p class="auth__footer">
      New here? <a routerLink="/new">Start a team</a> or open the invite link a teammate sent you.
    </p>
  </section>
  <section class="auth__stage" aria-label="The globe">
    <mo-globe-fallback label="The globe, with no pins" />
  </section>
</main>
