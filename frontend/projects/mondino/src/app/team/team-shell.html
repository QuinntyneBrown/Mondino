<mo-app-header homeAddress="/globe" (home)="goHome()" (invite)="invite($event)">
  @for (item of navigation; track item.path) {
    <a
      nav
      class="segmented__option"
      [routerLink]="item.path"
      [attr.aria-current]="screen() === item.path ? 'page' : null"
      >{{ item.label }}</a
    >
  }
  @if (viewer(); as viewer) {
    <a
      me
      class="app-header__me"
      routerLink="/profile"
      [attr.aria-current]="screen() === '/profile' ? 'page' : null"
      aria-label="Profile &amp; Settings"
    >
      <mo-avatar size="sm" [initials]="viewer.initials" [colour]="viewer.colour" />
    </a>
  }
</mo-app-header>
<router-outlet />
<div class="toast-region" role="status" aria-live="polite">
  @if (toaster.current(); as toast) {
    @if (toast.tone === 'success') {
      <mo-toast [strong]="toast.strong" [text]="toast.text" (dismiss)="toaster.dismiss()" />
    }
  }
</div>
<div class="toast-region toast-region--alert" role="alert" aria-live="assertive">
  @if (toaster.current(); as toast) {
    @if (toast.tone === 'danger') {
      <mo-toast
        tone="danger"
        [strong]="toast.strong"
        [text]="toast.text"
        (dismiss)="toaster.dismiss()"
      />
    }
  }
</div>
