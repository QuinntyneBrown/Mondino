<main id="main" class="page" tabindex="-1">
  <h1>Where everyone is in their day</h1>
  @if (lead(); as lead) {
    <p class="page__lead tnum">{{ lead }}</p>
  }
  @if (ribbon(); as ribbon) {
    <mo-day-ribbon
      [markers]="ribbon.markers"
      [rows]="ribbon.rows"
      [scale]="scale()"
      [address]="addressOf"
      (teammateChosen)="choose($event)"
    />
  }
  <div class="section-head">
    <h2>Everyone, west to east</h2>
    <mo-segmented
      label="Filter by status"
      controls="team-list"
      [options]="tabs()"
      [value]="filter()"
      (valueChange)="chooseFilter($event)"
    />
  </div>
  <div id="team-list" role="tabpanel" [attr.aria-labelledby]="'tab-' + filter()">
    @if (rows().length === 0 && note(); as note) {
      <mo-list-note
        [title]="note.title"
        [text]="note.text"
        action="Show everyone"
        (actionChosen)="chooseFilter('all')"
      />
    } @else {
      <mo-team-table
        [caption]="caption()"
        [rows]="rows()"
        [address]="addressOf"
        (teammateChosen)="choose($event)"
      />
    }
  </div>
</main>
