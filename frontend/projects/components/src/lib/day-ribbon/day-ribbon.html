<section class="day-ribbon" aria-labelledby="mo-day-ribbon-title">
  <h2 class="visually-hidden" id="mo-day-ribbon-title">The day, hour by hour</h2>
  <div class="day-ribbon__scroll" role="region" aria-labelledby="mo-day-ribbon-title" tabindex="0">
    <div class="day-ribbon__track" [style.--rows]="rows()">
      <span class="day-ribbon__band day-ribbon__band--night day-ribbon__band--first"
        ><span>Night</span></span
      ><span class="day-ribbon__band day-ribbon__band--edge day-ribbon__band--morning"
        ><span>Morning</span></span
      ><span class="day-ribbon__band day-ribbon__band--working"><span>Working hours</span></span
      ><span class="day-ribbon__band day-ribbon__band--edge day-ribbon__band--evening"
        ><span>Evening</span></span
      ><span class="day-ribbon__band day-ribbon__band--night day-ribbon__band--last"></span>
      <ul>
        @for (marker of markers(); track marker.teammateId) {
          <li>
            <a
              class="day-ribbon__marker"
              [attr.href]="address()(marker.teammateId)"
              [style.--at]="marker.at.toFixed(2) + '%'"
              [style.--row]="marker.lane"
              [attr.title]="marker.name + ' · ' + marker.cityName"
              [attr.aria-label]="marker.name + ', ' + marker.localTime"
              (click)="choose($event, marker.teammateId)"
            >
              <mo-avatar [initials]="marker.initials" [colour]="marker.colour" />
            </a>
          </li>
        }
      </ul>
    </div>
    <ul class="day-ribbon__scale tnum" aria-hidden="true">
      @for (mark of scale(); track $index) {
        <li>{{ mark }}</li>
      }
    </ul>
  </div>
</section>
