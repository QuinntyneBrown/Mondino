<div class="globe-stage">
  @if (variant() === 'disc') {
    <span class="globe-loading__disc skeleton" role="img" aria-label="The globe is loading"></span>
  } @else {
    <div class="globe globe--placeholder" role="img" aria-label="The globe is loading">
      <svg class="globe__art" viewBox="0 0 600 600" aria-hidden="true" focusable="false">
        <circle class="globe__ocean" cx="300" cy="300" r="252" />
        <circle class="globe__outline" cx="300" cy="300" r="252" stroke-width="2" />
      </svg>
      <div class="globe__pins" aria-hidden="true"></div>
    </div>
  }
</div>
