<div aria-live="polite">
  @switch (shown()) {
    @case ('Private') {
      <p class="lookup" [id]="messageId()">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <span>Only your city is shown. Your postal code stays private.</span>
      </p>
    }
    @case ('Locating') {
      <p class="lookup" [id]="messageId()">
        <svg class="icon icon--spin" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <span>Finding {{ postalCode() }}…</span>
      </p>
    }
    @case ('Found') {
      <p class="lookup lookup--found" [id]="messageId()">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path
            d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
          />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span
          ><strong>{{ cityAndRegion() }}</strong> — pinned at city level.</span
        >
      </p>
    }
    @case ('NotFound') {
      <p class="lookup lookup--error" [id]="messageId()" role="alert">
        <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" x2="12" y1="8" y2="12" />
          <line x1="12" x2="12.01" y1="16" y2="16" />
        </svg>
        <span>{{ notFound() }}</span>
      </p>
    }
    @default {
      <p class="lookup" [id]="messageId()"></p>
    }
  }
</div>
