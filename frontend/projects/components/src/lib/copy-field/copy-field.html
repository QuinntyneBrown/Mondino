<div class="copy-field">
  <input
    class="copy-field__value"
    type="text"
    readonly
    [attr.id]="inputId()"
    [attr.aria-label]="inputId() ? null : label()"
    [value]="value()"
  /><button mo-button variant="primary" size="sm" type="button" (click)="copyLink.emit()">
    @if (copied()) {
      <svg class="icon icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" /></svg
      >Copied
    } @else {
      <svg class="icon icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
        <path d="M9 17H7A5 5 0 0 1 7 7h2" />
        <path d="M15 7h2a5 5 0 1 1 0 10h-2" />
        <line x1="8" x2="16" y1="12" y2="12" /></svg
      >Copy link
    }
  </button>
</div>
