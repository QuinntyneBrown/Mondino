<div class="invite-prompt card">
  <div>
    <h2 class="invite-prompt__title">It’s just you on {{ teamName() }} so far</h2>
    <p class="invite-prompt__text">
      This list fills up west to east as teammates join with the invite link.
    </p>
  </div>
  <button mo-button variant="primary" type="button" (click)="choose($event)">
    <svg class="icon icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <line x1="19" x2="19" y1="8" y2="14" />
      <line x1="22" x2="16" y1="11" y2="11" />
    </svg>
    Invite teammates
  </button>
</div>
