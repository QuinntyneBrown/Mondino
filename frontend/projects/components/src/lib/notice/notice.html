<div class="notice" [attr.role]="status() ? 'status' : null">
  <span class="notice__icon">
    <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
      @switch (icon()) {
        @case ('link-off') {
          <path d="M9 17H7A5 5 0 0 1 7 7" />
          <path d="M15 7h2a5 5 0 0 1 4 8" />
          <line x1="8" x2="12" y1="12" y2="12" />
          <line x1="2" x2="22" y1="2" y2="22" />
        }
        @case ('offline') {
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        }
        @case ('mail-check') {
          <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
          <path d="m16 19 2 2 4-4" />
        }
        @case ('users') {
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        }
      }
    </svg>
  </span>
  <h1 class="notice__title" [attr.id]="titleId()" [attr.tabindex]="status() ? -1 : null">
    {{ title() }}
  </h1>
  <!-- prettier-ignore -->
  <p class="notice__text">{{ text() }}@if (emphasis()) {<strong>{{ emphasis() }}</strong>}{{ rest() }}</p>
  <div class="notice__actions"><ng-content select="[slot=actions]" /></div>
</div>
