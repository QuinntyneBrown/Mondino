<div class="empty" [class.empty--error]="tone() === 'error'">
  <span class="empty__icon">
    @if (tone() === 'error') {
      <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
        <path d="m10.3 3.8-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.2l-8-14a2 2 0 0 0-3.4 0Z" />
        <path d="M12 9v4m0 4h.01" />
      </svg>
    } @else {
      <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
        <path d="M8 2v3" />
        <path d="M16 2v3" />
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M3 9h18" />
        <path d="M8 13h.01" />
        <path d="M12 13h.01" />
        <path d="M16 13h.01" />
        <path d="M8 17h.01" />
        <path d="M12 17h.01" />
        <path d="M16 17h.01" />
      </svg>
    }
  </span>
  @if (level() === 1) {
    <h1 class="empty__title">{{ title() }}</h1>
  } @else {
    <h2 class="empty__title">{{ title() }}</h2>
  }
  <p class="empty__text">{{ text() }}</p>
  <div class="empty__actions"><ng-content /></div>
</div>
