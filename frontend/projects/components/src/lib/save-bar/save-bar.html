@switch (state()) {
  @case ('saving') {
    <div class="save-bar" role="status">
      <span class="save-bar__text">Saving…</span>
      <button mo-button variant="on-inverse" size="sm" type="button" aria-busy="true" disabled>
        <svg
          class="icon icon--sm icon--spin"
          aria-hidden="true"
          focusable="false"
          viewBox="0 0 24 24"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
        >Saving
      </button>
    </div>
  }
  @case ('saved') {
    <div class="save-bar save-bar--saved" role="status">
      <span class="save-bar__text"
        ><svg class="icon icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M20 6 9 17l-5-5" /></svg
        >Saved — your pin is up to date</span
      >
    </div>
  }
  @case ('failed') {
    <div class="save-bar save-bar--failed" role="alert">
      <span class="save-bar__text"
        ><svg class="icon icon--sm" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" x2="12" y1="8" y2="12" />
          <line x1="12" x2="12.01" y1="16" y2="16" /></svg
        >Couldn’t save. Your changes are still here.</span
      >
      <button mo-button variant="on-inverse" size="sm" type="button" (click)="retry.emit()">
        Try again
      </button>
    </div>
  }
  @case ('unsaved') {
    <div class="save-bar" role="status">
      <span class="save-bar__text">You have unsaved changes</span>
      <button mo-button variant="on-inverse" size="sm" type="button" (click)="save.emit()">
        Save changes
      </button>
    </div>
  }
}
