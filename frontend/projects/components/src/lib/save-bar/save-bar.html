<div class="save-bar" role="status">
  @if (saving()) {
    <span class="save-bar__text">Saving…</span>
    <button mo-button variant="on-inverse" size="sm" type="button" aria-busy="true" disabled>
      <svg
        class="icon icon--sm icon--spin"
        aria-hidden="true"
        focusable="false"
        viewBox="0 0 24 24"
      >
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Saving
    </button>
  } @else {
    <span class="save-bar__text">You have unsaved changes</span>
    <button mo-button variant="on-inverse" size="sm" type="button" (click)="save.emit()">
      Save changes
    </button>
  }
</div>
